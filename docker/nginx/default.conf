# Laravel用の標準的なnginx設定。
# 静的ファイル以外はすべてpublic/index.phpを経由させ、Laravelのルーティングに渡す。
server {
    listen 80;
    index index.php index.html;

    # LaravelはPHPアプリの公開ディレクトリを必ず public/ にする決まりなので、
    # ドキュメントルートもここに合わせる。
    root /var/www/html/public;

    location / {
        # 実ファイルが存在すればそれを返し、なければindex.phpにフォールバックさせる
        try_files $uri $uri/ /index.php?$query_string;
    }

    # .phpへのリクエストはFastCGI経由でappコンテナ(PHP-FPM)の9000番ポートに渡す
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # .env等の隠しファイルへの直アクセスを防ぐ
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
